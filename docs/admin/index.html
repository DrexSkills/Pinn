<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Pinn · Admin</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
:root{--bg:#ffffff;--bg2:#f0fdf4;--text:#0a0a0a;--muted:#5b6b60;--g:#22c55e;--gd:#15803d;--onG:#04210f;--card:#ffffff;--line:#d9f2e2;--shadow:0 10px 40px rgba(21,128,61,.10);color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#060d08;--bg2:#0b1a10;--text:#f2fff6;--muted:#8fb09b;--gd:#4ade80;--card:#0d1a11;--line:#1d3a27;--shadow:0 10px 40px rgba(0,0,0,.4);color-scheme:dark}}
*{box-sizing:border-box;margin:0}
body{min-height:100vh;background:var(--bg);color:var(--text);font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:24px 18px 48px}
.logo{font-weight:800;font-size:1.3rem;letter-spacing:-.02em}.logo span{color:var(--g)}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;gap:12px}
button,.btn{background:var(--g);color:var(--onG);border:0;font:inherit;font-weight:700;padding:10px 18px;border-radius:999px;cursor:pointer}
button.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
input{font:inherit;font-size:1rem;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;width:100%;outline:none}
input:focus{border-color:var(--g)}
.login{max-width:360px;margin:12vh auto 0;text-align:center;display:grid;gap:12px}
.login h1{font-size:1.6rem}.muted{color:var(--muted);font-size:.9rem}.err{color:#dc2626;font-size:.9rem;min-height:1.2em}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow)}
.stat b{display:block;font-size:2rem;letter-spacing:-.02em}.stat span{color:var(--muted);font-size:.85rem}
.tools{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}.tools input{flex:1;min-width:180px}
.tablebox{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--card)}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{padding:11px 14px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--muted);font-weight:600;font-size:.8rem;text-transform:uppercase;letter-spacing:.04em}
tr:last-child td{border-bottom:0}
td.x button{padding:4px 10px;font-size:.8rem;background:transparent;color:var(--muted);border:1px solid var(--line)}
.empty{padding:28px;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <div id="login" class="login">
    <div class="logo">Pinn<span>.homes</span></div>
    <h1>Admin</h1>
    <p class="muted">Enter your admin passcode to see signups.</p>
    <input type="password" id="pass" placeholder="Passcode" autocomplete="current-password">
    <button id="enter">Log in</button>
    <div class="err" id="lerr"></div>
  </div>

  <div id="dash" hidden>
    <header><div class="logo">Pinn<span>.homes</span> · Admin</div><div><button class="ghost" id="refresh">Refresh</button> <button class="ghost" id="out">Log out</button></div></header>
    <div class="stats">
      <div class="stat"><b id="total">0</b><span>Total signups</span></div>
      <div class="stat"><b id="today">0</b><span>Last 24 hours</span></div>
      <div class="stat"><b id="week">0</b><span>Last 7 days</span></div>
      <div class="stat"><b id="split">–</b><span>Mac / Windows / other</span></div>
    </div>
    <div class="tools"><input id="q" placeholder="Search emails…"><button id="csv">Export CSV</button></div>
    <div class="tablebox"><table><thead><tr><th>#</th><th>Email</th><th>Platform</th><th>Signed up</th><th>From</th><th></th></tr></thead><tbody id="rows"></tbody></table></div>
  </div>
</div>
<script>
(function(){
var SB="https://ihbblnbqjzdewiopqmxd.supabase.co",KEY="sb_publishable_vqKKGrWuY7C6H3DfyoTPVQ_cGqBlLjS",pass="",data=[];
function $(id){return document.getElementById(id);}
function rpc(fn,body){return fetch(SB+"/rest/v1/rpc/"+fn,{method:"POST",headers:{"Content-Type":"application/json",apikey:KEY,Authorization:"Bearer "+KEY},body:JSON.stringify(body)}).then(function(r){if(!r.ok)throw r.status;return r.status===204?null:r.json();});}
function esc(t){return String(t==null?"":t).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function load(){
  return rpc("pinn_admin_list",{p_pass:pass}).then(function(d){data=d||[];try{sessionStorage.setItem("pinnAdmin",pass);}catch(e){}$("login").hidden=true;$("dash").hidden=false;render();});
}
function render(){
  var now=Date.now(),day=0,week=0,m=0,w=0,o=0;
  data.forEach(function(r){var t=now-new Date(r.created_at).getTime();if(t<864e5)day++;if(t<6048e5)week++;r.platform==="mac"?m++:r.platform==="windows"?w++:o++;});
  $("total").textContent=data.length;$("today").textContent=day;$("week").textContent=week;$("split").textContent=m+" / "+w+" / "+o;
  var q=$("q").value.trim().toLowerCase(),n=data.length,html="";
  data.forEach(function(r,i){if(q&&r.email.indexOf(q)<0)return;
    var from=r.referrer?r.referrer.replace(/^https?:\/\//,"").split("/")[0]:"direct";
    html+="<tr><td>"+(n-i)+"</td><td>"+esc(r.email)+"</td><td>"+esc(r.platform||"")+"</td><td>"+new Date(r.created_at).toLocaleString()+"</td><td>"+esc(from)+"</td><td class='x'><button data-id='"+r.id+"'>Remove</button></td></tr>";});
  $("rows").innerHTML=html||"<tr><td colspan='6' class='empty'>"+(data.length?"No matches.":"No signups yet. Share pinn.homes!")+"</td></tr>";
}
function login(){pass=$("pass").value;$("lerr").textContent="";$("enter").disabled=true;
  load().catch(function(){$("lerr").textContent="Wrong passcode.";}).then(function(){$("enter").disabled=false;});}
$("enter").onclick=login;$("pass").onkeydown=function(e){if(e.key==="Enter")login();};
$("q").oninput=render;$("refresh").onclick=function(){load().catch(function(){});};
$("out").onclick=function(){try{sessionStorage.removeItem("pinnAdmin");}catch(e){}pass="";data=[];$("dash").hidden=true;$("login").hidden=false;$("pass").value="";};
$("rows").onclick=function(e){var id=e.target.getAttribute("data-id");if(!id)return;var r=data.find(function(x){return String(x.id)===id;});
  if(!confirm("Remove "+r.email+" from the waitlist?"))return;rpc("pinn_admin_delete",{p_pass:pass,p_id:+id}).then(load).catch(function(){alert("Couldn’t remove it.");});};
$("csv").onclick=function(){var lines=["email,platform,signed_up,referrer"];data.forEach(function(r){lines.push([r.email,r.platform||"",r.created_at,r.referrer||""].map(function(v){return'"'+String(v).replace(/"/g,'""')+'"';}).join(","));});
  var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([lines.join("\n")],{type:"text/csv"}));a.download="pinn-waitlist.csv";a.click();};
try{var saved=sessionStorage.getItem("pinnAdmin");if(saved){pass=saved;load().catch(function(){sessionStorage.removeItem("pinnAdmin");});}}catch(e){}
})();
</script>
</body>
</html>
