<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pinn — AI that stays out of sight</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #f8f8f6;
      color: #111;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .badge {
      background: rgba(26, 122, 60, 0.1);
      border: 1px solid rgba(26, 122, 60, 0.3);
      border-radius: 999px;
      padding: 6px 16px;
      font-size: 12px;
      letter-spacing: 0.5px;
      color: #1a7a3c;
      margin-bottom: 32px;
      font-weight: 500;
    }

    h1 {
      font-size: clamp(42px, 8vw, 80px);
      font-weight: 700;
      letter-spacing: -2.5px;
      text-align: center;
      line-height: 1.05;
      margin-bottom: 20px;
      color: #0a0a0a;
    }

    h1 span {
      background: linear-gradient(135deg, #0a0a0a 30%, #1a7a3c);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p.sub {
      font-size: 18px;
      color: #888;
      text-align: center;
      max-width: 420px;
      line-height: 1.6;
      margin-bottom: 48px;
    }

    .buttons {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 80px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 14px 28px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      transition: opacity 0.15s, transform 0.15s;
    }
    .btn:hover { opacity: 0.85; transform: translateY(-1px); }
    .btn svg { width: 16px; height: 16px; flex-shrink: 0; }

    .btn-primary {
      background: #1a7a3c;
      color: #fff;
      box-shadow: 0 4px 20px rgba(26,122,60,0.25);
    }

    .btn-secondary {
      background: #fff;
      color: #333;
      border: 1px solid #e0e0e0;
    }

    footer {
      margin-top: 80px;
      font-size: 12px;
      color: #bbb;
    }
  </style>
</head>
<body>

  <div class="badge">Pinn 12 — Now available</div>

  <h1><span>AI that stays<br>out of sight.</span></h1>

  <p class="sub">A hidden AI assistant that lives on your screen. No dock icon. No taskbar. Just press a hotkey.</p>

        <path d="M12 5v14M5 12l7 7 7-7"/>
      </svg>
      Download for Windows
    </a>

</html>
