name: Build Pinn 12 for Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Create config.js from secret
        run: |
          echo "module.exports = { GROQ_API_KEY: '${{ secrets.GROQ_API_KEY }}' }" > config.js
        shell: bash

      - name: Build Windows installer
        run: npm run build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installer as artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pinn-13-Windows
          path: dist/*.exe

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.13
          name: Pinn 1.0.13 — Windows
          body: |
            ## Pinn 1.0.13 for Windows

            **Install:** Run the `.exe`, Pinn starts automatically.

            **Hotkey:** `Ctrl+Shift+P` to show/hide.

            ### What's new in 1.0.13
            - Fixed: no more "JavaScript killed" error when running inside Lockdown Browser
          files: dist/*.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
